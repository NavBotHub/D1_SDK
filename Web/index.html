<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="A minimal English Wi-Fi controller for the NavBot D1 robot."
    />
    <title>D1 Wi-Fi Controller Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="protocol.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="controller" aria-labelledby="page-title">
        <header class="hero">
          <div>
            <p class="eyebrow">NAVBOT D1 ROBOT</p>
            <h1 id="page-title">Wi-Fi Controller Demo</h1>
          </div>
        </header>

        <div class="connection" role="status" aria-live="polite">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <div>
            <strong id="connection-status">Connecting to D1...</strong>
            <span id="connection-address">192.168.50.1:8081</span>
          </div>
        </div>

        <div class="actions" aria-label="D1 actions">
          <button class="action action-learning" data-mode="3" disabled>
            <span class="action-icon" aria-hidden="true">▶</span>
            <span>
              <strong>Start Learning</strong>
              <small>Enter reinforcement learning</small>
            </span>
          </button>

          <button class="action action-stand" data-mode="1" disabled>
            <span class="action-icon" aria-hidden="true">↑</span>
            <span>
              <strong>Stand Up</strong>
              <small>Move to standing posture</small>
            </span>
          </button>

          <button class="action action-crouch" data-mode="2" disabled>
            <span class="action-icon" aria-hidden="true">↓</span>
            <span>
              <strong>Crouch Down</strong>
              <small>Move to lowered posture</small>
            </span>
          </button>
        </div>

        <div id="command-status" class="command-status" aria-live="polite">
          Waiting for the D1 connection.
        </div>

        <p class="safety-note">
          Keep the robot in a clear area. An accepted command does not confirm
          that the physical motion has finished.
        </p>
      </section>
    </main>
  </body>
</html>
